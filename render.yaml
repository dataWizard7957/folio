# Render Blueprint: the Folio live demo as a free static site.
# The real UI built in demo mode (VITE_DEMO=true) runs on in-browser sample
# data. No backend, no Ollama, nothing stored on a server.
services:
  - type: web
    name: folio-demo
    runtime: static
    buildCommand: cd frontend && npm ci && VITE_DEMO=true npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
