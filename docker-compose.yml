# Folio app in Docker, using the Ollama already installed on your machine.
#   docker compose up -d   →  http://localhost:5173
# No Ollama installed? Use the bundled one instead:
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
services:
  backend:
    build: ./backend
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
      FOLIO_EMBED_MODEL: ${FOLIO_EMBED_MODEL:-nomic-embed-text}
      FOLIO_VISION_MODEL: ${FOLIO_VISION_MODEL:-gemma3:4b}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # makes the host reachable on Linux too
    volumes:
      - folio-data:/data
    ports:
      - "127.0.0.1:8000:8000"   # for the browser extension
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  folio-data:
